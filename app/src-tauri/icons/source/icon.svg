<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Ferrydeck 应用图标：一只章鱼（多条触手 = 同时连接多个站点和客户端）。按 macOS 图标网格，主体 824×824 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3A6B"/>
      <stop offset="1" stop-color="#0B8F8C"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A7A"/>
      <stop offset="1" stop-color="#F0625A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06223A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <g filter="url(#soft)" fill="none" stroke="url(#body)" stroke-width="54" stroke-linecap="round">
    <!-- 触手：从身体底部向两侧和下方弯出 -->
    <path d="M400 560 C 330 620, 250 640, 236 720 C 228 770, 280 790, 300 752"/>
    <path d="M440 590 C 410 670, 360 720, 380 790 C 392 832, 446 822, 440 780"/>
    <path d="M512 600 C 512 690, 500 740, 520 800 C 534 840, 586 820, 570 780"/>
    <path d="M584 590 C 614 670, 664 720, 644 790 C 632 832, 578 822, 584 780"/>
    <path d="M624 560 C 694 620, 774 640, 788 720 C 796 770, 744 790, 724 752"/>
  </g>
  <!-- 身体 -->
  <path d="M512 232 C 676 232, 744 352, 744 456 C 744 560, 648 612, 512 612 C 376 612, 280 560, 280 456 C 280 352, 348 232, 512 232 Z" fill="url(#body)" filter="url(#soft)"/>
  <!-- 眼睛 -->
  <circle cx="440" cy="450" r="46" fill="#FFFFFF"/>
  <circle cx="584" cy="450" r="46" fill="#FFFFFF"/>
  <circle cx="450" cy="460" r="22" fill="#1B3A6B"/>
  <circle cx="594" cy="460" r="22" fill="#1B3A6B"/>
  <!-- 高光 -->
  <ellipse cx="452" cy="318" rx="70" ry="34" fill="#FFFFFF" opacity="0.28"/>
</svg>
